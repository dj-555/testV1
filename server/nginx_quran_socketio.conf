# Place these `location` blocks inside your existing
# `server { server_name sbc.itcallinfo.info; listen 443 ssl; ... }` block.
#
# This keeps Jitsi on the same domain and forwards Quran app traffic to Node on 3000.

location /quran-socket.io/ {
    proxy_pass http://127.0.0.1:3000/quran-socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location /quran-health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
